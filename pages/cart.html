<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phone Store</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css"
      rel="stylesheet"
    />
       
    <link rel="stylesheet" href="../assets/css/bootstrap.css">
    <link rel="stylesheet" href="../assets/css/cart.css" />
    <style>
      @font-face {
        font-family: "OPPOSans-VN-Medium";
        src: url("/assets/fonts/OPPOSans-VN-Medium.otf") format("opentype");
      }

      body {
        background-color: #f8f9fa;
        color: #333;
        font-family: "OPPOSans-VN-Medium", sans-serif;
      }
      .navbar {
        background-color: #fff;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      }
      .cart-table img {
        width: 50px;
        height: 50px;
        object-fit: cover;
        margin-right: 10px;
      }
      .quantity-control {
        display: flex;
        align-items: center;
        gap: 5px;
      }
    </style>
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg fixed-top">
      <div class="container">
        <div class="nav-logo">
          <img
            src="/assets/images/index_img/logo_3.jpg"
            alt=""
            style="height: 40px; margin-right: 30px"
          />
        </div>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item">
              <a class="nav-link" href="#home">Trang chủ</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#products">Sản phẩm</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#contact">Liên hệ</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#cart">Giỏ hàng</a>
            </li>
          </ul>
          <div class="d-flex">
            <a href="#login" class="btn btn-outline-dark me-2">Đăng nhập</a>
            <a href="#register" class="btn btn-dark">Đăng ký</a>
          </div>
        </div>
      </div>
    </nav>

    <!-- Giỏ hàng -->
    <section id="cart" class="py-5 mt-5">
      <div class="container">
        <h2 class="text-center mb-4">Giỏ hàng của bạn</h2>
        <!-- Thông báo khi giỏ hàng trống -->
        <!-- <div id="cart-empty" class="text-center">
          <p>Hiện tại giỏ hàng của bạn đang trống.</p>
          <a href="#products" class="btn btn-dark">Tiếp tục mua sắm</a>
        </div> -->
        <!-- Nội dung giỏ hàng -->
        <div class="order-summary-content container w-50">
    
          <div class="all">
           <div class="yourCart top-content">
               <a href="#">< Quay về trang home</a>
              
           </div>
                   <div class="cart ">
                    
                     <div class="cart-content">
                       <div class="cart-box">
                         <img src="../assets/images/logo/iphone.jpg" class="cart-img" alt="" />
                         <div class="cart-detail">
                           <h2 class="cart-product-title">Iphone 15 promax</h2>
                           <span class="cart-price">20.500.000đ</span>
                           <div class="cart-quantity">
                             <button id="decrement">-</button>
                             <span class="number">1</span>
                             <button id="increment">+</button>
                           </div>
                         </div>
                         <i class="ri-delete-bin-line cart-remove"></i>
                       </div>
                     </div>
                     <div class="total">
                       <div class="total-title">Tổng tiền: </div>
                       <div class="total-price">0đ</div>
                     </div>
                     <button class="btn-buy">Đặt hàng</button>
                   </div>
          </div>
        </div>
    
      </div>
    </section>

    <!-- Footer -->
    <footer class="py-4 text-center">
      <p>© 2025 PhoneStore. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
