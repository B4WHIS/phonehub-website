<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phone Store</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../assets/css/bootstrap.css" />
    <link rel="stylesheet" href="../assets/css/cart.css" />
    <style>
      @font-face {
        font-family: "OPPOSans-VN-Medium";
        src: url("/assets/fonts/OPPOSans-VN-Medium.otf") format("opentype");
      }

      body {
        background-color: #f8f9fa;
        color: #333;
        font-family: "OPPOSans-VN-Medium", sans-serif;
      }
      .navbar {
        background-color: #fff;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      }
      .cart-table img {
        width: 50px;
        height: 50px;
        object-fit: cover;
        margin-right: 10px;
      }
      .quantity-control {
        display: flex;
        align-items: center;
        gap: 5px;
      }
    </style>
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg fixed-top">
      <div class="container">
        <div class="nav-logo">
          <a href="../pages/index.html">
            <img
              src="../assets/images/index_img/logo_3.jpg"
              alt=""
              style="height: 40px; margin-right: 30px"
            />
          </a>
        </div>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item">
              <a class="nav-link" href="../pages/index.html">Trang chủ</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="../pages/product.html">Sản phẩm</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Liên hệ</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="../pages/news.html">Tin tức</a>
            </li>

            <li class="nav-item d-flex align-items-center">
              <input
                type="text"
                id="searchInput"
                class="form-control me-2"
                placeholder="Tìm kiếm sản phẩm..."
                style="width: 200px"
              />
              <button class="btn btn-outline-dark" onclick="searchProducts()">
                Tìm
              </button>
            </li>
          </ul>
          <div class="d-flex">
            <a href="../pages/login.html" class="btn btn-outline-dark me-2"
              >Đăng nhập</a
            >
            <a href="../pages/register.html" class="btn btn-dark">Đăng ký</a>
          </div>
        </div>
      </div>
    </nav>

    <!-- Giỏ hàng -->
    <section id="cart" class="py-5 mt-5">
      <div class="container">
        <h2 class="text-center mb-4">Giỏ hàng của bạn</h2>
 
        <div class="order-summary-content container w-50">
          <div class="all">
            <div class="cart">
              <div class="cart-content">
              
              </div>
              <div class="total">
                <div class="total-title">Tổng tiền:</div>
                <div class="total-price">0đ</div>
              </div>
             <a href="../pages/checkout.html"><button class="btn-buy">Đặt hàng</button></a> 
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="py-4 text-center">
      <p>© 2025 PhoneStore. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/cart.js"></script>
  </body>
</html>
