<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chi tiết sản phẩm - PhoneStore</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      @font-face {
        font-family: "Kelson Sans Light";
        src: url("/assets/fonts/SVN-Kelson Sans Light.ttf") format("truetype");
      }
      @font-face {
        font-family: "Kelson Sans Bold";
        src: url("/assets/fonts/SVN-Kelson Sans Bold.ttf") format("truetype");
      }
      body {
        background-color: #f8f9fa;
        color: #333;
        font-family: "Kelson Sans Light", sans-serif;
      }
      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        font-family: "Kelson Sans Bold", sans-serif;
      }
      .navbar {
        background-color: #fff;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      }
      .product-detail img {
        max-width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light fixed-top">
      <div class="container">
        <a class="navbar-brand" href="../pages/index.html">PhoneStore</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item">
              <a class="nav-link" href="../pages/index.html#home">Trang chủ</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="../pages/index.html#products"
                >Sản phẩm</a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <section class="py-5">
      <div class="container">
        <div class="row">
          <div class="col-md-6 product-detail">
            <img id="product-image" src="" alt="Product Image" />
          </div>
          <div class="col-md-6">
            <h1 id="product-name"></h1>
            <p id="product-price" class="lead"></p>
            <p id="product-description"></p>
            <a href="#" class="btn btn-outline-dark">Thêm vào giỏ</a>
          </div>
        </div>
      </div>
    </section>

    <footer class="py-4 text-center">
      <p>© 2025 PhoneStore. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/product.js"></script>
    <script>
      const urlParams = new URLSearchParams(window.location.search);
      const productId = urlParams.get("id");
      let product = null;
      for (const brand in products) {
        product = products[brand].find((p) => p.id === productId);
        if (product) break;
      }
      if (product) {
        document.getElementById("product-image").src = product.image;
        document.getElementById("product-name").textContent = product.name;
        document.getElementById("product-price").textContent = product.price;
        document.getElementById("product-description").textContent =
          product.description;
      } else {
        document.querySelector(".container").innerHTML =
          "<h2>Sản phẩm không tồn tại</h2>";
      }
    </script>
  </body>
</html>
