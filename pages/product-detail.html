<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chi tiết sản phẩm - PhoneHub</title>
    <link rel="stylesheet" href="../assets/css/bootstrap.min.css" />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <script src="../assets/js/bootstrap.bundle.min.js"></script>
  </head>
  <body>
    <!-- Nav  -->
    <nav class="navbar navbar-expand-lg fixed-top">
      <div class="container">
        <div class="nav-logo">
          <img
            src="/assets/images/index_img/logo_3.jpg"
            alt=""
            style="height: 40px; margin-right: 30px"
          />
        </div>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item">
              <a class="nav-link" href="../pages/index.html">Trang chủ</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="../index.html">Sản phẩm</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="../index.html#contact">Liên hệ</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="../pages/cart.html">Giỏ hàng</a>
            </li>
          </ul>
          <div class="d-flex">
            <a href="#login" class="btn btn-outline-dark me-2">Đăng nhập</a>
            <a href="#register" class="btn btn-dark">Đăng ký</a>
          </div>
        </div>
      </div>
    </nav>

    <!-- Chi tiết sản phẩm -->
    <section class="py-5 mt-3">
      <h1 class="container border-bottom" id="product-name"></h1>
      <div class="container all p-4" id="product-container">
        <div class="row">
          <div class="col-md-6 product-detail d-flex flex-column">
            <img
              id="product-image"
              src=""
              alt="Product Image"
              class="img-fluid"
            />
            <div
              id="thumbnail-container"
              class="mt-3 d-flex gap-2 flex-wrap"
            ></div>
          </div>
          <div class="col-md-6 mt-5 right">
            <div class="content-detail">
              <p class="dl">Dung lượng:</p>
              <ul id="storage-options" class="list-dl"></ul>
              <p class="dl">Màu sắc:</p>
              <ul id="color-options" class="list-ms"></ul>
              <p id="product-price" class="lead"></p>
              <p class="dl">Giới thiệu về máy:</p>
              <p id="product-description"></p>
              <div class="mt-3 p-3">
                <button
                  id="add-to-cart"
                  class="btn btn-outline-dark"
                  onclick="handleAddToCart()"
                >
                  Thêm vào giỏ
                </button>
                <button id="buy-now" class="btn btn-dark">Mua ngay!</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script src="/assets/js/product.js"></script>
    <script src="../assets/js/addCart.js"></script>
  </body>
</html>
