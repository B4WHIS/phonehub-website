<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chi tiết sản phẩm - PhoneStore</title>
    <link rel="stylesheet" href="../assets/css/bootstrap.min.css" />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <style>
      .list-dl,
      .list-ms {
        list-style: none;
        padding: 0;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .list-dl li button {
        padding: 8px 16px;
        border: 1px solid #ddd;
        border-radius: 5px;
        background: #f8f9fa;
        cursor: pointer;
        transition: all 0.3s;
      }
      .list-dl li button.active,
      .list-dl li button:hover {
        background: #0d6efd;
        color: white;
        border-color: #0d6efd;
      }
      .list-ms li button {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        border: 2px solid transparent;
        cursor: pointer;
        transition: all 0.3s;
      }
      .list-ms li button.active,
      .list-ms li button:hover {
        border: 2px solid #0d6efd;
      }
      .dl {
        font-weight: bold;
        margin-top: 15px;
      }
      .product-detail img {
        max-width: 100%;
        height: auto;
        border-radius: 10px;
        border: 1px solid #ddd;
      }
      .thumbnail {
        width: 60px;
        height: 60px;
        object-fit: cover;
        border-radius: 5px;
        cursor: pointer;
        border: 1px solid #ddd;
      }
      .thumbnail.active {
        border: 2px solid #0d6efd;
      }
      #product-price {
        font-size: 1.5rem;
        color: #dc3545;
        font-weight: bold;
      }
    </style>
  </head>

    <nav class="navbar navbar-expand-lg fixed-top">
      <div class="container">
        <div class="nav-logo">
          <img
            src="../assets/images/index_img/logo_3.jpg"
            alt=""
            style="height: 40px; margin-right: 30px"
          />
        </div>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item">
              <a class="nav-link" href="../pages/index.html">Trang chủ</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="../index.html">Sản phẩm</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="../index.html#contact">Liên hệ</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="../pages/cart.html">Giỏ hàng</a>
            </li>
          </ul>
          <div class="d-flex">
            <a href="../pages/login.html" class="btn btn-outline-dark me-2"
              >Đăng nhập</a
            >
            <a href="../pages/register.html" class="btn btn-dark">Đăng ký</a>
          </div>
        </div>
      </div>
    </nav>

    <!-- Chi tiết sản phẩm -->
    <section class="py-5 mt-3">
      <h1 class="container border-bottom" id="product-name"></h1>
      <div class="container all p-4" id="product-container">
        <div class="row">
          <div class="col-md-6 product-detail d-flex flex-column">
            <img
              id="product-image"
              src=""
              alt="Product Image"
              class="img-fluid"
            />
            <div
              id="thumbnail-container"
              class="mt-3 d-flex gap-2 flex-wrap"
            ></div>
          </div>
          <div class="col-md-6 mt-5 right">
            <div class="content-detail">
              <p class="dl">Dung lượng:</p>
              <ul id="storage-options" class="list-dl"></ul>
              <p class="dl">Màu sắc:</p>
              <ul id="color-options" class="list-ms"></ul>
              <p id="product-price" class="lead"></p>
              <p class="dl">Giới thiệu về máy:</p>
              <p id="product-description"></p>
              <div class="mt-3 p-3">
                <button id="add-to-cart" class="btn btn-outline-dark">
                  Thêm vào giỏ
                </button>
                <button id="buy-now" class="btn btn-dark">Mua ngay!</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script src="../assets/js/product.js"></script>
