<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PhoneHub-ProductDetail</title>

    <link href="/assets/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/product-detail.css" />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg fixed-top">
      <div class="container">
        <div class="nav-logo">
          <a href="../pages/index.html">
            <img
              src="../assets/images/index_img/logo_3.jpg"
              alt=""
              style="height: 40px; margin-right: 30px"
          /></a>
        </div>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item">
              <a class="nav-link" href="../pages/index.html">Trang chủ</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="../pages/product.html">Sản phẩm</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#contact">Liên hệ</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="../pages/cart.html">Giỏ hàng</a>
            </li>
            <li class="nav-item d-flex align-items-center">
              <input
                type="text"
                id="searchInput"
                class="form-control me-2"
                placeholder="Tìm kiếm sản phẩm..."
                style="width: 200px"
              />
              <button class="btn btn-outline-dark" onclick="searchProducts()">
                Tìm
              </button>
            </li>
          </ul>
          <div class="d-flex">
            <a href="../pages/login.html" class="btn btn-outline-dark me-2"
              >Đăng nhập</a
            >
            <a href="../pages/register.html" class="btn btn-dark">Đăng ký</a>
          </div>
        </div>
      </div>
    </nav>
    <!-- Product Detail -->
    <section class="py-5 mt-3">
      <h1 class="container border-bottom" id="product-name"></h1>
      <div class="container all p-4">
        <div class="row">
          <div class="col-md-6 product-detail d-flex flex-column">
            <img
              id="product-image"
              src=""
              alt="Product Image"
              class="img-fluid"
            />
            <div
              id="thumbnail-container"
              class="mt-3 d-flex gap-2 flex-wrap"
            ></div>
          </div>
          <div class="col-md-6 mt-5 right">
            <div class="content-detail">
              <p class="dl">Dung lượng:</p>
              <ul id="storage-options" class="list-dl"></ul>
              <p class="dl">Màu sắc:</p>
              <ul id="color-options" class="list-ms"></ul>
              <p id="product-price" class="lead"></p>
              <p class="dl">Giới thiệu về máy:</p>
              <p id="product-description"></p>
              <div class="mt-3 p-3">
                <button id="add-to-cart" class="btn btn-outline-dark">
                  Thêm vào giỏ
                </button>
                <button id="buy-now" class="btn btn-dark">Mua ngay!</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Liên hệ -->
    <section id="contact" class="py-5">
      <div class="container">
        <h2 class="text-center mb-4">Liên hệ</h2>
        <p class="text-center">
          Email: contact@phonehub.com | Hotline: 0123-456-789
        </p>
      </div>
    </section>

    <!-- Footer -->
    <footer class="py-4 text-center">
      <p>© 2025 PhoneHub. All rights reserved.</p>
    </footer>

    <script src="../assets/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/product.js"></script>
    <script>
      const urlParams = new URLSearchParams(window.location.search);
      const productId = urlParams.get("id");
      let product = null;
      let currentBrand = null;

      for (const brand in products) {
        product = products[brand].find((p) => p.id === productId);
        if (product) {
          currentBrand = brand;
          break;
        }
      }

      if (product) {
        document.getElementById("product-image").src = product.mainImage;
        document.getElementById("product-name").textContent = product.name;
        document.getElementById("product-description").textContent =
          product.description;

        let currentVariant = product.variants[0];
        let currentStorage = currentVariant.storageOptions[0];

        document.getElementById("product-price").textContent =
          currentStorage.price;

        const colorOptions = document.getElementById("color-options");
        product.variants.forEach((variant, index) => {
          const li = document.createElement("li");
          li.innerHTML = `
            <button type="button"
                    id="color-option-${index}"
                    class="color-option btn ${index === 0 ? "active" : ""}"
                    style="background-color: ${variant.colorCode}"
                    data-variant-index="${index}"
                    title="${variant.color}">
            </button>
            <span class="color-name">${variant.color}</span>
          `;
          colorOptions.appendChild(li);
        });

        const storageOptions = document.getElementById("storage-options");
        currentVariant.storageOptions.forEach((option, index) => {
          const li = document.createElement("li");
          li.innerHTML = `
            <button type="button"
                    id="storage-option-${index}"
                    class="storage-option btn btn-outline-light ${
                      index === 0 ? "active" : ""
                    }"
                    data-storage-index="${index}">
              ${option.capacity}
            </button>
          `;
          storageOptions.appendChild(li);
        });

        const thumbnailContainer = document.getElementById(
          "thumbnail-container"
        );
        currentVariant.images.forEach((image, index) => {
          const img = document.createElement("img");
          img.src = image;
          img.alt = `Thumbnail ${index + 1}`;
          img.className = `thumbnail ${index === 0 ? "active" : ""}`;
          img.dataset.imageIndex = index;
          thumbnailContainer.appendChild(img);
        });

        document.querySelectorAll(".color-option").forEach((btn) => {
          btn.addEventListener("click", function () {
            const variantIndex = this.dataset.variantIndex;
            currentVariant = product.variants[variantIndex];

            document.getElementById("product-image").src =
              currentVariant.images[0];

            document
              .querySelectorAll(".color-option")
              .forEach((b) => b.classList.remove("active"));
            this.classList.add("active");

            storageOptions.innerHTML = "";
            currentVariant.storageOptions.forEach((option, index) => {
              const li = document.createElement("li");
              li.innerHTML = `
                <button type="button"
                        class="storage-option btn btn-outline-light ${
                          index === 0 ? "active" : ""
                        }"
                        data-storage-index="${index}">
                  ${option.capacity}
                </button>
              `;
              storageOptions.appendChild(li);
            });

            currentStorage = currentVariant.storageOptions[0];
            document.getElementById("product-price").textContent =
              currentStorage.price;

            thumbnailContainer.innerHTML = "";
            currentVariant.images.forEach((image, index) => {
              const img = document.createElement("img");
              img.src = image;
              img.alt = `Thumbnail ${index + 1}`;
              img.className = `thumbnail ${index === 0 ? "active" : ""}`;
              img.dataset.imageIndex = index;
              thumbnailContainer.appendChild(img);
            });
          });
        });

        document
          .getElementById("storage-options")
          .addEventListener("click", function (e) {
            if (e.target.classList.contains("storage-option")) {
              const storageIndex = e.target.dataset.storageIndex;
              currentStorage = currentVariant.storageOptions[storageIndex];

              document
                .querySelectorAll(".storage-option")
                .forEach((b) => b.classList.remove("active"));
              e.target.classList.add("active");

              document.getElementById("product-price").textContent =
                currentStorage.price;
            }
          });

        document
          .getElementById("thumbnail-container")
          .addEventListener("click", function (e) {
            if (e.target.classList.contains("thumbnail")) {
              const imageIndex = e.target.dataset.imageIndex;

              document.getElementById("product-image").src =
                currentVariant.images[imageIndex];

              document
                .querySelectorAll(".thumbnail")
                .forEach((t) => t.classList.remove("active"));
              e.target.classList.add("active");
            }
          });

        document
          .getElementById("add-to-cart")
          .addEventListener("click", function () {
            addToCart({
              id: product.id,
              name: product.name,
              color: currentVariant.color,
              storage: currentStorage.capacity,
              price: currentStorage.price,
              image: currentVariant.images[0],
            });
          });

        document
          .getElementById("buy-now")
          .addEventListener("click", function () {
            window.location.href = `checkout.html?productId=${product.id}&color=${currentVariant.color}&storage=${currentStorage.capacity}`;
          });
      }
      // } else {
      //   document.querySelector(".container").innerHTML =
      //     "<h2>Sản phẩm không tồn tại</h2>";
      // }

      function addToCart(item) {
        let cart = JSON.parse(localStorage.getItem("cart")) || [];

        cart.push(item);
        localStorage.setItem("cart", JSON.stringify(cart));

        alert(
          `Đã thêm ${item.name} (${item.color}, ${item.storage}) vào giỏ hàng!`
        );
      }
    </script>
  </body>
</html>
