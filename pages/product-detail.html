<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chi tiết sản phẩm - PhoneStore</title>
    <link href="../assets/css/bootstrap.min.css" rel="stylesheet" />
    <style>
      body {
        background-color: #f8f9fa;
        color: #333;
        font-family: "Kelson Sans Light", sans-serif;
      }
      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        font-family: "Kelson Sans Bold", sans-serif;
      }
      .navbar {
        background-color: #fff;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      }
      .product-detail img {
        max-width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <section class="py-5">
      <div class="container">
        <div class="row">
          <div class="col-md-6 product-detail">
            <img id="product-image" src="" alt="Product Image" />
          </div>
          <div class="col-md-6">
            <h1 id="product-name"></h1>
            <p id="product-price" class="lead"></p>
            <p id="product-description"></p>
            <a href="#" class="btn btn-outline-dark">Thêm vào giỏ</a>
          </div>
        </div>
      </div>
    </section>

    <script src="../assets/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/product.js"></script>
    <script>
      const urlParams = new URLSearchParams(window.location.search);
      const productId = urlParams.get("id");
      let product = null;
      for (const brand in products) {
        product = products[brand].find((p) => p.id === productId);
        if (product) break;
      }
      if (product) {
        document.getElementById("product-image").src = product.image;
        document.getElementById("product-name").textContent = product.name;
        document.getElementById("product-price").textContent = product.price;
        document.getElementById("product-description").textContent =
          product.description;
      } else {
        document.querySelector(".container").innerHTML =
          "<h2>Sản phẩm không tồn tại</h2>";
      }
    </script>
  </body>
</html>
