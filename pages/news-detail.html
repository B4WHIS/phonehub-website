<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News details</title>
    <link href="../assets/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        @font-face {
          font-family: "OPPOSans-VN-Medium";
          src: url("/assets/fonts/OPPOSans-VN-Medium.otf") format("opentype");
        }
  
        body {
          background-color: #f8f9fa;
          color: #333;
          font-family: "OPPOSans-VN-Medium", sans-serif;
        }
        .navbar {
          background-color: #fff;
          box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
  
        .product-card {
          width: 250px;
          margin: 0 auto;
          padding: 2px;
          padding-top: 20px;
          height: 500px;
        }
        .product-card img {
          height: 250px;
          object-fit: cover;
        }
        .product-card img:hover {
          transform: scale(1.05);
          transition: all 0.3s ease-in-out;
        }
        .product-card .card-body {
          padding: 10px;
        }
        .product-card .button-group {
          display: flex;
          justify-content: space-between;
          align-items: center;
        }
        footer {
          background-color: #fff;
          border-top: 1px solid #dee2e6;
        }
        .product-slider {
          overflow: hidden;
          position: relative;
        }
        .news-list {
          display: flex;
          transition: transform 0.5s ease;
        }
        .news-list .col {
          flex: 0 0 20%;
          max-width: 20%;
        }
        .truncate-text {
          display: inline-block;
          max-width: 100%;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }
        .news-card a:hover {
          transform: scale(1.05);
          transition: all 0.3s ease-in-out;
        }
      </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg fixed-top mb-3">
        <div class="container">
          <div class="nav-logo">
            <img
              src="/assets/images/index_img/logo_3.jpg"
              alt=""
              style="height: 40px; margin-right: 30px"
            />
          </div>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
              <li class="nav-item">
                <a class="nav-link" href="#home">Trang chủ</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#products">Sản phẩm</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#contact">Liên hệ</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="../pages/cart.html">Giỏ hàng</a>
              </li>
              <li class="nav-item">
                <a class="nav-link active" style="color: black" href="#"
                  >Tin tức</a
                >
              </li>
            </ul>
            <div class="d-flex">
              <a href="#login" class="btn btn-outline-dark me-2">Đăng nhập</a>
              <a href="#register" class="btn btn-dark">Đăng ký</a>
            </div>
          </div>
        </div>
      </nav>
      <div class="container">
        <div class="d-flex justify-content-center align-items-center mb-3 mt-5">
            <img alt="Author's avatar" class="rounded-5 mr-3 w-75" src="../assets/images/news/iphone-16-series-52.jpg"/>
           
           </div>
      </div>
</body>
</html>
