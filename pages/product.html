<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phone Store</title>
    <link rel="stylesheet" href="../assets/css/bootstrap.min.css" />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <script src="../assets/js/bootstrap.bundle.min.js"></script>
    <style>
      @font-face {
        font-family: "OPPOSans-VN-Medium";
        src: url("/assets/fonts/OPPOSans-VN-Medium.otf") format("opentype");
      }

      body {
        background-color: #f8f9fa;
        color: #333;
        font-family: "OPPOSans-VN-Medium", sans-serif;
      }
      .navbar {
        background-color: #fff;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      }
      .product-card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .product-card {
        width: 100%;
        height: 500px;
        object-fit: contain;
        transition: transform 0.3s;
        padding: 20px;
      }
      .product-card:hover {
        transform: scale(1.05);
      }

      .button-group {
        display: flex;
        gap: 10px;
      }
    </style>
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg fixed-top">
      <div class="container">
        <div class="nav-logo">
          <a href="../pages/index.html">
            <img
              src="../assets/images/index_img/logo_3.jpg"
              alt=""
              style="height: 40px; margin-right: 30px"
            />
          </a>
        </div>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item">
              <a class="nav-link" href="#home">Trang chủ</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#products">Sản phẩm</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#contact">Liên hệ</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="../pages/news.html">Tin tức</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="../pages/cart.html">Giỏ hàng</a>
            </li>
            <li class="nav-item d-flex align-items-center">
              <input
                type="text"
                id="searchInput"
                class="form-control me-2"
                placeholder="Tìm kiếm sản phẩm..."
                style="width: 200px"
              />
              <button class="btn btn-outline-dark" onclick="searchProducts()">
                Tìm
              </button>
            </li>
          </ul>
          <div class="d-flex">
            <a href="../pages/login.html" class="btn btn-outline-dark me-2"
              >Đăng nhập</a
            >
            <a href="../pages/register.html" class="btn btn-dark">Đăng ký</a>
          </div>
        </div>
      </div>
    </nav>

    <!-- Sản phẩm -->
    <section id="products" class="py-5 mt-5">
      <div class="container">
        <h2 class="text-center mb-4">Danh sách sản phẩm</h2>
        <div class="row" id="product-list"></div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="py-4 text-center">
      <p>© 2025 PhoneStore. All rights reserved.</p>
    </footer>

    <script src="../assets/js/product.js"></script>
    <script>
      function displayProducts() {
        const productList = document.getElementById("product-list");
        productList.innerHTML = "";

        for (const brand in products) {
          products[brand].forEach((product) => {
            const col = document.createElement("div");
            col.className = "col-md-4 col-lg-3 mb-4";
            col.innerHTML = `
              <div class="card product-card">
                <img src="${product.mainImage}" alt="${product.name}" class="card-img-top">
                <div class="card-body">
                  <h5 class="card-title">${product.name}</h5>
                  <p class="card-text">${product.basePrice}</p>
                  <div class="button-group">
                    <button class="btn btn-outline-dark" onclick="addToCart('${product.id}')">Thêm</button>
                    <a href="/pages/product-detail.html?id=${product.id}" class="btn btn-dark">Xem chi tiết</a>
                  </div>
                </div>
              </div>
            `;
            productList.appendChild(col);
          });
        }
      }

      function addToCart(productId) {
        let product = null;
        for (const brand in products) {
          product = products[brand].find((p) => p.id === productId);
          if (product) break;
        }

        if (!product) {
          alert("Sản phẩm không tồn tại!");
          return;
        }

        let cart = JSON.parse(localStorage.getItem("cart")) || [];
        const existingItem = cart.find((item) => item.id === productId);
        if (existingItem) {
          existingItem.quantity += 1;
        } else {
          cart.push({
            id: product.id,
            name: product.name,
            price: product.basePrice,
            image: product.mainImage,
            quantity: 1,
          });
        }

        localStorage.setItem("cart", JSON.stringify(cart));
        alert(`Đã thêm ${product.name} vào giỏ hàng!`);
      }

      displayProducts();
    </script>
  </body>
</html>
